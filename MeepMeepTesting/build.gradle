// This is a plain desktop Java module — it does NOT get built into the robot's app.
// It runs only on your computer, inside Android Studio, to visualize autonomous paths
// before you have real hardware to test on.
plugins {
    id 'java'
    id 'application'
}

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

repositories {
    mavenCentral()
    maven { url = 'https://maven.brott.dev/' }
}

dependencies {
    implementation 'com.acmerobotics.roadrunner:MeepMeep:0.1.7'
}

application {
    mainClass = 'com.example.meepmeeptesting.MeepMeepTesting'
}
